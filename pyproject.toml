[build-system]
build-backend = 'mesonpy'
requires = ['meson-python>=0.15']

[project]
name = 'vapoursynth-retinex'
dynamic = ['version']
description = 'Retinex (MSRCP/MSRCR) plugin for VapourSynth (API 4)'
readme = 'README.md'
requires-python = '>=3.8'
license = { file = 'LICENSE' }

[project.scripts]
vs-retinex-install = 'vapoursynth_retinex.__main__:main'

[tool.meson-python.args]
setup = ['-Dpython_package=true']
